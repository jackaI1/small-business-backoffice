[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cash-reconciliation-forecast"
version = "0.1.0"
description = "Bank reconciliation and a 13-week cash forecast from CSV exports"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2,<4", "XlsxWriter>=3.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "openpyxl>=3.1,<4", "ruff>=0.9,<1"]

[project.scripts]
cash-forecast = "cashforecast.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cashforecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires TEST_DATABASE_URL pointing to a disposable PostgreSQL database"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
