[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "creative-brief-tracker"
version = "0.1.0"
description = "Airtable creative briefs, weekday workbacks and deadline email drafts"
requires-python = ">=3.10"
dependencies = ["httpx==0.28.1"]

[project.scripts]
brief-tracker = "brief_tracker.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/brief_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
