name: wp-membership-manager / Plugin checks
on:
  push:
    branches:
    - main
    paths:
    - projects/wp-membership-manager/**
    - .github/workflows/wp-membership-manager-ci.yml
  pull_request:
    paths:
    - projects/wp-membership-manager/**
    - .github/workflows/wp-membership-manager-ci.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
        - '8.2'
        - '8.3'
        - '8.4'
    steps:
    - uses: actions/checkout@v4
    - uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        tools: composer
        coverage: none
    - run: composer install --no-interaction --prefer-dist
    - run: composer test
    - run: composer lint
    - run: php -l wp-membership-manager.php && php -l demo/seed.php
    timeout-minutes: 20
  integration:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: bash demo/setup.sh
    - run: docker compose run --rm cli eval-file wp-content/plugins/wp-membership-manager/tests/integration.php
    - run: python3 tests/http_smoke.py
    - if: failure()
      run: docker compose logs --tail=40 wordpress db mailpit
    - if: always()
      run: docker compose down -v --remove-orphans
    timeout-minutes: 20
defaults:
  run:
    working-directory: projects/wp-membership-manager
