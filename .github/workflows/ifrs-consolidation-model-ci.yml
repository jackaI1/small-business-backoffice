name: ifrs-consolidation-model / Consolidation checks
on:
  push:
    branches:
    - main
    paths:
    - projects/ifrs-consolidation-model/**
    - .github/workflows/ifrs-consolidation-model-ci.yml
  pull_request:
    paths:
    - projects/ifrs-consolidation-model/**
    - .github/workflows/ifrs-consolidation-model-ci.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python:
        - '3.11'
        - '3.13'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    - run: python -m pip install -e '.[dev]'
    - run: ruff check .
    - run: python -m pytest -q
    - run: ifrs-close --input examples/three_subs --output output/demo
    - run: ifrs-close --statutory --input examples/statutory_group --output output/annual
    - uses: actions/upload-artifact@v4
      with:
        name: close-pack-python-${{ matrix.python }}
        path: projects/ifrs-consolidation-model/output/
    timeout-minutes: 20
defaults:
  run:
    working-directory: projects/ifrs-consolidation-model
