name: internal-controls-tracker / Checks
on:
  push:
    branches:
    - main
    paths:
    - projects/internal-controls-tracker/**
    - .github/workflows/internal-controls-tracker-ci.yml
  pull_request:
    paths:
    - projects/internal-controls-tracker/**
    - .github/workflows/internal-controls-tracker-ci.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
        - '3.11'
        - '3.12'
        - '3.13'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
        cache: pip
        cache-dependency-path: projects/internal-controls-tracker/requirements-dev.txt
    - run: python -m pip install -r requirements-dev.txt
    - run: python -m pip install -e . --no-deps
    - run: ruff check src tests
    - run: ruff format --check src tests
    - run: pytest --cov=controls_tracker --cov-report=term-missing --cov-fail-under=95
    - name: Run the documented example
      run: 'controls --db demo.sqlite demo

        controls --db demo.sqlite status --as-of 2026-08-10

        controls --db demo.sqlite export review.xlsx --as-of 2026-08-10

        '
    timeout-minutes: 20
defaults:
  run:
    working-directory: projects/internal-controls-tracker
