name: civic-service-request-assistant / CI
on:
  push:
    branches:
    - main
    paths:
    - projects/civic-service-request-assistant/**
    - .github/workflows/civic-service-request-assistant-ci.yml
  pull_request:
    paths:
    - projects/civic-service-request-assistant/**
    - .github/workflows/civic-service-request-assistant-ci.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        version: 0.9.9
        enable-cache: true
        working-directory: projects/civic-service-request-assistant
    - run: uv sync --frozen --python 3.12
    - run: uv run ruff check civic tests scripts
    - run: uv run ruff format --check civic tests scripts
    - run: uv run pytest -q
  live-local-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        version: 0.9.9
        enable-cache: true
        working-directory: projects/civic-service-request-assistant
    - run: uv sync --frozen --python 3.12
    - run: uv run playwright install --with-deps chromium
    - name: Install local model runtime
      run: "mkdir -p \"$RUNNER_TEMP/civic-ollama\"\ncurl -fsSL --retry 3 https://github.com/ollama/ollama/releases/download/v0.34.3/ollama-linux-amd64.tar.zst\
        \ \\\n  | tar --zstd -x -C \"$RUNNER_TEMP/civic-ollama\"\necho \"$RUNNER_TEMP/civic-ollama/bin\" >> \"$GITHUB_PATH\"\
        \n"
    - name: Exercise real model, browser, SQLite and Graph sandbox
      run: uv run python scripts/smoke.py
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: live-demo-evidence
        path: projects/civic-service-request-assistant/artifacts/
defaults:
  run:
    working-directory: projects/civic-service-request-assistant
