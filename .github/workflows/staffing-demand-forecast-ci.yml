name: staffing-demand-forecast / CI
on:
  push:
    branches:
    - main
    paths:
    - projects/staffing-demand-forecast/**
    - .github/workflows/staffing-demand-forecast-ci.yml
  pull_request:
    paths:
    - projects/staffing-demand-forecast/**
    - .github/workflows/staffing-demand-forecast-ci.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python:
        - '3.11'
        - '3.13'
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python }}
        working-directory: projects/staffing-demand-forecast
    - run: uv sync --frozen --extra dev
    - run: uv run ruff check .
    - run: uv run ruff format --check .
    - run: uv run pytest -q
    - run: uv run staffing-refresh --synthetic --output outputs/ci
    - run: uv run python scripts/validate_powerbi.py
    - uses: actions/upload-artifact@v4
      if: matrix.python == '3.13'
      with:
        name: validated-staffing-report
        path: projects/staffing-demand-forecast/outputs/ci/
        retention-days: 7
    timeout-minutes: 20
  powerbi-model:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - run: dotnet run --project scripts/PowerBiModelCheck -- powerbi/Staffing.SemanticModel/model.bim
    timeout-minutes: 20
defaults:
  run:
    working-directory: projects/staffing-demand-forecast
