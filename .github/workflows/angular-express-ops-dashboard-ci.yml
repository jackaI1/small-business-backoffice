name: angular-express-ops-dashboard / CI
on:
  push:
    branches:
    - main
    paths:
    - projects/angular-express-ops-dashboard/**
    - .github/workflows/angular-express-ops-dashboard-ci.yml
  pull_request:
    paths:
    - projects/angular-express-ops-dashboard/**
    - .github/workflows/angular-express-ops-dashboard-ci.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: projects/angular-express-ops-dashboard/package-lock.json
    - run: npm ci
    - run: npx playwright install --with-deps chromium
    - run: npm run lint
    - run: npm test
    - run: npm run build
    - run: npm run test:smoke
    - run: npm run test:browser
    - run: npm run test:e2e
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: browser-test-results
        path: 'projects/angular-express-ops-dashboard/playwright-report/

          projects/angular-express-ops-dashboard/test-results/'
        retention-days: 7
defaults:
  run:
    working-directory: projects/angular-express-ops-dashboard
