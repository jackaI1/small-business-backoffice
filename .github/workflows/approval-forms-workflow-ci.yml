name: approval-forms-workflow / Workflow checks
on:
  push:
    branches:
    - main
    paths:
    - projects/approval-forms-workflow/**
    - .github/workflows/approval-forms-workflow-ci.yml
  pull_request:
    paths:
    - projects/approval-forms-workflow/**
    - .github/workflows/approval-forms-workflow-ci.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: gradle/actions/setup-gradle@v4
    - name: Run all tests and the approval demo
      run: ./gradlew clean test demo
    - name: Save test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: workflow-test-reports
        path: projects/approval-forms-workflow/build/reports/tests/test
defaults:
  run:
    working-directory: projects/approval-forms-workflow
